<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Booking</title>
    <style>
        /* Internal CSS Styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .bus-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        .booking-form {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            font-weight: bold;
            display: block;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .form-group button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-group button:hover {
            background-color: #45a049;
        }

        .audio-section, .video-section {
            margin-top: 20px;
            text-align: center;
        }

        .audio-section audio, .video-section video {
            width: 100%;
            max-width: 600px;
            border-radius: 8px;
        }

        .footer {
            background-color: #4CAF50;
            color: white;
            padding: 10px 0;
            text-align: center;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

    </style>
</head>
<body>
    <header>
        <h1>Bus Booking System</h1>
    </header>

    <div class="container">
        <!-- Bus Image Section -->
        <img src="https://assets.volvo.com/is/image/VolvoInformationTechnologyAB/blue-bus?qlt=82&wid=1024&ts=1660212095501&dpr=off&fit=constrain" alt="Bus Image" class="bus-image">

        <!-- Booking Form Section -->
        <div class="booking-form">
            <h2>Book Your Ticket</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <select id="destination" name="destination" required>
                        <option value="New York">New York</option>
                        <option value="Los Angeles">Los Angeles</option>
                        <option value="Chicago">Chicago</option>
                        <option value="Miami">Miami</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Travel Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
                <div class="form-group">
                    <button type="submit">Book Now</button>
                </div>
            </form>
        </div>

        <!-- Audio Section -->
        <div class="audio-section">
            <h3>Listen to Travel Tips</h3>
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Video Section -->
        <div class="video-section">
            <h3>Watch Our Bus Tour</h3>
            <video controls>
                <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2025 Bus Booking. All Rights Reserved.</p>
    </footer>

    <script>
        // JavaScript for booking form submission
        document.getElementById('booking-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent form submission for now

            const name = document.getElementById('name').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;

            if (name && destination && date) {
                alert(`Thank you, ${name}! Your bus ticket to ${destination} on ${date} has been booked.`);
            } else {
                alert("Please fill in all the fields.");
            }
        });
    </script>
</body>
</html>
